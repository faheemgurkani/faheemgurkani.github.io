name: Deploy Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Keep baked fallback JSON fresh; the live site still fetches GitHub on every visit.
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/retro-brutalist-portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: v2/retro-brutalist-portfolio/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN || github.token }}

      - name: Add .nojekyll for GitHub Pages
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2/retro-brutalist-portfolio/out

      - uses: actions/deploy-pages@v4
